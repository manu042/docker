---
- name: Backup sshd_config
  copy:
    src: "{{ ssh_config_file }}"
    dest: "{{ ssh_backup_file }}"
    remote_src: yes
    owner: root
    group: root
    mode: '0600'

- name: Apply SSH hardening settings
  lineinfile:
    path: "{{ ssh_config_file }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop: "{{ ssh_settings }}"
  notify: Validate sshd config

- ansible.builtin.import_tasks: check_sshd_config.yml
  