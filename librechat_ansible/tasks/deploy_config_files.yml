---
- name: Copy .env.librechat file
  ansible.builtin.copy:
    src: .env.librechat
    dest: '{{ project_dir }}/.env.librechat'
    mode: '0600'

- name: Deploy .env.librechat.ovr file
  ansible.builtin.template:
    src: .env.librechat.ovr
    dest: '{{ project_dir }}/.env.librechat.ovr'
    mode: '0600'

- name: Deploy .env.mlsearch file
  ansible.builtin.template:
    src: .env.mlsearch
    dest: '{{ project_dir }}/.env.mlsearch'
    mode: '0600'

- name: Deploy .env.rag_api file
  ansible.builtin.template:
    src: .env.rag_api
    dest: '{{ project_dir }}/.env.rag_api'
    mode: '0600'

- name: Deploy .env.vdb file
  ansible.builtin.template:
    src: .env.vdb
    dest: '{{ project_dir }}/.env.vdb'
    mode: '0600'

- name: Deploy docker-compose.yml file
  ansible.builtin.template:
    src: docker-compose.yml
    dest: '{{ project_dir }}/docker-compose.yml'
    mode: '0600'

- name: Deploy librechat.yaml file
  ansible.builtin.template:
    src: librechat.yaml
    dest: '{{ project_dir }}/librechat.yaml'
    mode: '0600'
